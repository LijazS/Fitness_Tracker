trigger:
  batch: true
  branches:
    include:
      - master

pool:
  vmImage: ubuntu-latest

variables:
  imageRepository: fitnessapp
  imageTag: $(Build.BuildId)
  acrLoginServer: fitnessacr.azurecr.io

steps:
  - checkout: self
    displayName: Checkout source code

  - task: UseNode@1
    displayName: Install Node.js
    inputs:
      version: 20.x

  - script: npm install
    displayName: Install dependencies

  - task: Docker@2
    displayName: Build and push Docker image
    inputs:
      command: buildAndPush
      repository: $(imageRepository)
      Dockerfile: '**/Dockerfile'

      # Exact name of your Docker Registry/ACR service connection
      containerRegistry: acr-coneection

      tags: |
        $(imageTag)
        latest

  - task: KubernetesManifest@1
    displayName: Deploy to AKS
    inputs:
      action: deploy

      # Exact name of your Kubernetes service connection
      kubernetesServiceConnection: k8s-connection

      namespace: l-ns

      manifests: |
        $(Build.SourcesDirectory)/full.yaml

      containers: |
        $(acrLoginServer)/$(imageRepository):$(imageTag)

  - task: Bash@3
    displayName: Slack notification
    condition: always()
    continueOnError: true
    inputs:
      targetType: inline
      script: |
        if [ "$(Agent.JobStatus)" = "Succeeded" ]; then
          MESSAGE="✅ Pipeline SUCCESS | Project: $(System.TeamProject) | Repo: $(Build.Repository.Name) | Branch: $(Build.SourceBranchName) | Build: $(Build.BuildNumber)"
        else
          MESSAGE="❌ Pipeline $(Agent.JobStatus) | Project: $(System.TeamProject) | Repo: $(Build.Repository.Name) | Branch: $(Build.SourceBranchName) | Build: $(Build.BuildNumber)"
        fi

        curl --fail-with-body \
          --request POST \
          --header "Content-Type: application/json" \
          --data "{\"text\":\"$MESSAGE\"}" \
          "$SLACK_WEBHOOK_URL"
    env:
      SLACK_WEBHOOK_URL: $(SLACK_WEBHOOK_URL)